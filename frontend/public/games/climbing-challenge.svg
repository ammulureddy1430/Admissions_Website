<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 100" width="100%" height="100%">
  <rect width="160" height="100" fill="#070a13" rx="10"/>
  <!-- Court lines -->
  <rect x="10" y="10" width="140" height="80" fill="none" stroke="#1e293b" stroke-width="1.5"/>
  <rect x="55" y="10" width="50" height="30" fill="#111827" stroke="#38bdf8" stroke-width="1"/>
  <path d="M 10 50 Q 50 50 50 50" stroke="#38bdf8" stroke-dasharray="2" stroke-width="1"/>
  <circle cx="80" cy="90" r="25" fill="none" stroke="#38bdf8" stroke-width="1"/>
  <!-- Hoop -->
  <line x1="70" y1="13" x2="90" y2="13" stroke="#f1f5f9" stroke-width="1.5"/>
  <circle cx="80" cy="18" r="4" fill="none" stroke="#f97316" stroke-width="1.5"/>
  <!-- Tactical strategy vectors -->
  <!-- Player (Playmaker) -->
  <circle cx="80" cy="65" r="5" fill="#6366f1"/>
  <!-- Teammate A cutting -->
  <circle cx="45" cy="35" r="4" fill="#0ea5e9"/>
  <path d="M 45 35 Q 60 25 74 20" fill="none" stroke="#38bdf8" stroke-dasharray="2" stroke-width="1" marker-end="url(#arrow)"/>
  <!-- Ball flying -->
  <circle cx="68" cy="42" r="3.5" fill="#f97316"/>
  <!-- Defender -->
  <circle cx="65" cy="30" r="4.5" fill="#ef4444"/>
  <!-- Legend / Text -->
  <text x="80" y="82" fill="#fb923c" font-family="sans-serif" font-size="7" font-weight="bold" text-anchor="middle" letter-spacing="1">PLAYMAKER</text>
  <!-- Marker -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#38bdf8"/>
    </marker>
  </defs>
</svg>
