<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
  <title id="title">Color Shift game</title>
  <desc id="desc">A robot catches matching colorful shapes</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#19245f"/>
      <stop offset="1" stop-color="#24567b"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#2c8d91"/>
      <stop offset="1" stop-color="#153650"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="640" height="360" rx="28" fill="url(#sky)"/>
  <circle cx="65" cy="90" r="78" fill="#70e9dd" opacity=".13"/>
  <circle cx="560" cy="112" r="64" fill="#70e9dd" opacity=".15"/>
  <circle cx="325" cy="142" r="40" fill="#70e9dd" opacity=".1"/>
  <rect y="278" width="640" height="82" fill="url(#floor)"/>
  <g stroke="#5fd8d4" stroke-opacity=".2" stroke-width="2">
    <path d="M0 278h640M70 278v82M150 278v82M230 278v82M310 278v82M390 278v82M470 278v82M550 278v82"/>
  </g>
  <g filter="url(#glow)" stroke="#fff" stroke-width="5">
    <circle cx="145" cy="85" r="25" fill="#2f80ed"/>
    <rect x="276" y="55" width="50" height="50" rx="8" fill="#f34f64"/>
    <path d="M474 53l30 52h-60z" fill="#35c88a"/>
    <path d="M205 153l29 29-29 29-29-29z" fill="#f7c948"/>
    <rect x="423" y="153" width="52" height="52" rx="8" fill="#2f80ed"/>
  </g>
  <g transform="translate(320 290)" filter="url(#glow)">
    <rect x="-50" y="-32" width="100" height="64" rx="30" fill="#f7ffff" stroke="#2cdbc4" stroke-width="7"/>
    <circle cx="-19" cy="-4" r="6" fill="#153650"/>
    <circle cx="19" cy="-4" r="6" fill="#153650"/>
    <path d="M-16 14q16 12 32 0" fill="none" stroke="#2c8d91" stroke-width="4" stroke-linecap="round"/>
  </g>
  <g transform="translate(32 25)">
    <rect width="168" height="44" rx="22" fill="#071633" opacity=".9"/>
    <circle cx="25" cy="22" r="12" fill="#2f80ed"/>
    <rect x="46" y="10" width="24" height="24" rx="5" fill="#2f80ed"/>
    <path d="M93 10l13 24H80z" fill="#2f80ed"/>
    <path d="M132 9l13 13-13 13-13-13z" fill="#2f80ed"/>
  </g>
  <text x="320" y="342" text-anchor="middle" fill="#dffff9" font-family="Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="3">WATCH • MOVE • ADAPT</text>
</svg>
