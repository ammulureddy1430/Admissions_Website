<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="60%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#450a0a"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="640" height="360" fill="url(#bg)"/>

  <!-- Track Curves -->
  <path d="M-50 250 C 200 250, 250 120, 450 120 C 600 120, 650 200, 750 200" fill="none" stroke="#1e293b" stroke-width="120" stroke-linecap="round"/>
  <!-- Alternating white/red dashed borders -->
  <path d="M-50 250 C 200 250, 250 120, 450 120 C 600 120, 650 200, 750 200" fill="none" stroke="#ffffff" stroke-width="130" stroke-dasharray="20 20" stroke-linecap="round"/>
  <path d="M-50 250 C 200 250, 250 120, 450 120 C 600 120, 650 200, 750 200" fill="none" stroke="#dc2626" stroke-width="130" stroke-dasharray="20 20" stroke-dashoffset="20" stroke-linecap="round"/>
  <path d="M-50 250 C 200 250, 250 120, 450 120 C 600 120, 650 200, 750 200" fill="none" stroke="#27282b" stroke-width="116" stroke-linecap="round"/>
  
  <!-- Dashed Center Line -->
  <path d="M-50 250 C 200 250, 250 120, 450 120 C 600 120, 650 200, 750 200" fill="none" stroke="#ffffff" stroke-width="2" stroke-dasharray="10 15"/>

  <!-- Skid Marks -->
  <path d="M 230 205 C 290 200, 310 150, 350 142" fill="none" stroke="#000000" stroke-width="6" opacity="0.6"/>
  <path d="M 250 215 C 310 210, 330 160, 370 152" fill="none" stroke="#000000" stroke-width="6" opacity="0.6"/>

  <!-- Drift Smoke -->
  <circle cx="230" cy="205" r="14" fill="#ffffff" opacity="0.4"/>
  <circle cx="215" cy="210" r="18" fill="#ffffff" opacity="0.25"/>
  <circle cx="250" cy="215" r="16" fill="#ffffff" opacity="0.35"/>

  <!-- Player Red Sports Car (Drifting Angle) -->
  <g transform="translate(320, 160) rotate(-22)">
    <!-- Spoiler -->
    <rect x="-32" y="-14" width="6" height="28" rx="1" fill="#111827"/>
    <!-- Back Wheels -->
    <rect x="-22" y="-15" width="10" height="5" rx="1" fill="#030712"/>
    <rect x="-22" y="10" width="10" height="5" rx="1" fill="#030712"/>
    <!-- Front Wheels (steered) -->
    <g transform="translate(18, -15) rotate(-15)">
      <rect x="-5" y="-2" width="10" height="5" rx="1" fill="#030712"/>
    </g>
    <g transform="translate(18, 10) rotate(-15)">
      <rect x="-5" y="-2" width="10" height="5" rx="1" fill="#030712"/>
    </g>
    <!-- Car Body -->
    <rect x="-26" y="-12" width="52" height="24" rx="5" fill="#ef4444"/>
    <!-- White Racing Stripes -->
    <rect x="-26" y="-3" width="52" height="6" fill="#ffffff"/>
    <!-- Glass Canopy -->
    <rect x="-2" y="-8" width="18" height="16" rx="3" fill="#0f172a"/>
    <rect x="3" y="-6" width="9" height="12" rx="1" fill="#38bdf8"/>
    <!-- Headlights -->
    <rect x="23" y="-10" width="3" height="5" rx="1" fill="#fef08a"/>
    <rect x="23" y="5" width="3" height="5" rx="1" fill="#fef08a"/>
    <!-- Brake Lights -->
    <rect x="-27" y="-9" width="2" height="4" fill="#ef4444"/>
    <rect x="-27" y="5" width="2" height="4" fill="#ef4444"/>
  </g>

  <!-- Typography -->
  <text x="27" y="45" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="25" font-weight="900" letter-spacing="4">DRIFT RACER</text>
  <text x="29" y="68" fill="#fca5a5" font-family="monospace" font-size="11" letter-spacing="2">STEER · DRIFT · ADAPT</text>
</svg>
