<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 100" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Glowing Speed Line Gradient -->
    <linearGradient id="speed-line" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#ea580c" stop-opacity="0" />
      <stop offset="50%" stop-color="#f97316" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#eab308" stop-opacity="1" />
    </linearGradient>

    <!-- F1 Car Gradient -->
    <linearGradient id="car-body" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
  </defs>

  <!-- Deep Blue Card Canvas -->
  <rect width="160" height="100" rx="12" fill="url(#bg-grad)" />

  <!-- Asphalt Road Segment -->
  <path d="M 60,100 L 75,0 L 85,0 L 100,100 Z" fill="#1e293b" opacity="0.6" />
  
  <!-- Dashed Center Divider -->
  <line x1="77" y1="100" x2="79" y2="0" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,6" opacity="0.5" />
  
  <!-- Red & White Rumble Strips -->
  <path d="M 60,100 L 75,0" stroke="#ef4444" stroke-width="2" stroke-dasharray="5,5" />
  <path d="M 100,100 L 85,0" stroke="#ef4444" stroke-width="2" stroke-dasharray="5,5" />

  <!-- Dynamic Speed Trails -->
  <path d="M 15 35 L 145 35" stroke="url(#speed-line)" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 5 65 L 155 65" stroke="url(#speed-line)" stroke-width="1.5" stroke-linecap="round" />
  <path d="M 25 15 L 135 15" stroke="url(#speed-line)" stroke-width="2" stroke-linecap="round" />

  <!-- Roadside Trees (Vector silhouettes) -->
  <circle cx="28" cy="45" r="8" fill="#15803d" opacity="0.4" />
  <circle cx="28" cy="42" r="6" fill="#16a34a" opacity="0.6" />
  <circle cx="132" cy="75" r="9" fill="#15803d" opacity="0.4" />
  <circle cx="132" cy="71" r="7" fill="#16a34a" opacity="0.6" />

  <!-- F1 Car Vector (Top-Down Center) -->
  <g transform="translate(80, 50) rotate(-15) scale(0.6)">
    <!-- Rear Wings -->
    <rect x="-24" y="24" width="48" height="6" rx="1" fill="#eab308" />
    <rect x="-18" y="16" width="36" height="4" rx="1" fill="#475569" />

    <!-- Big Tires -->
    <rect x="-22" y="12" width="6" height="12" rx="2" fill="#0f172a" />
    <rect x="16" y="12" width="6" height="12" rx="2" fill="#0f172a" />
    <rect x="-20" y="-18" width="5" height="10" rx="2" fill="#0f172a" />
    <rect x="15" y="-18" width="5" height="10" rx="2" fill="#0f172a" />

    <!-- Main Chassis -->
    <path d="M -12,20 L 12,20 L 8,-20 L -8,-20 Z" fill="url(#car-body)" />
    
    <!-- Carbon Racing Stripe -->
    <rect x="-2" y="-20" width="4" height="40" fill="#1e293b" />
    
    <!-- Driver Cockpit Windshield -->
    <path d="M -6,-2 L 6,-2 L 4,6 L -4,6 Z" fill="#bae6fd" />
    
    <!-- Front Spoiler -->
    <rect x="-16" y="-24" width="32" height="4" rx="1" fill="#eab308" />
  </g>
</svg>
