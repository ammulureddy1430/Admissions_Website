<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#081026"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="belt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#007f70"/>
      <stop offset="50%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#007f70"/>
    </linearGradient>
    <radialGradient id="redSphere" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ff7675"/>
      <stop offset="100%" stop-color="#d9383a"/>
    </radialGradient>
    <radialGradient id="blueSphere" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#74b9ff"/>
      <stop offset="100%" stop-color="#0984e3"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="640" height="360" rx="34" fill="url(#bg)"/>

  <!-- Title bar -->
  <rect x="30" y="32" width="580" height="52" rx="18" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
  <text x="320" y="65" fill="#00f5d4" font-family="monospace, sans-serif" font-size="20" font-weight="900" letter-spacing="3" text-anchor="middle">RULE SHIFT CHALLENGE</text>

  <!-- Conveyor Track -->
  <rect x="280" y="90" width="80" height="170" fill="#111827"/>
  <rect x="280" y="90" width="80" height="170" fill="none" stroke="url(#belt)" stroke-width="3"/>
  <!-- Rollers -->
  <line x1="285" y1="120" x2="355" y2="120" stroke="#374151" stroke-width="3"/>
  <line x1="285" y1="150" x2="355" y2="150" stroke="#374151" stroke-width="3"/>
  <line x1="285" y1="180" x2="355" y2="180" stroke="#374151" stroke-width="3"/>
  <line x1="285" y1="210" x2="355" y2="210" stroke="#374151" stroke-width="3"/>
  <line x1="285" y1="240" x2="355" y2="240" stroke="#374151" stroke-width="3"/>

  <!-- Scan Zone -->
  <rect x="270" y="220" width="100" height="45" fill="rgba(0, 245, 212, 0.05)" stroke="#00f5d4" stroke-width="2.5" stroke-dasharray="6 4" rx="4"/>
  <text x="320" y="214" fill="#00f5d4" font-family="monospace, sans-serif" font-size="10" font-weight="700" text-anchor="middle">SCAN ZONE</text>

  <!-- Buckets -->
  <!-- Left Bucket -->
  <circle cx="120" cy="270" r="45" fill="rgba(239, 83, 101, 0.05)" stroke="rgba(239, 83, 101, 0.4)" stroke-width="2.5" stroke-dasharray="4 3"/>
  <text x="120" y="330" fill="rgba(255,255,255,0.4)" font-family="monospace" font-size="10" font-weight="700" text-anchor="middle">SORT LEFT</text>

  <!-- Right Bucket -->
  <circle cx="520" cy="270" r="45" fill="rgba(59, 130, 246, 0.05)" stroke="rgba(59, 130, 246, 0.4)" stroke-width="2.5" stroke-dasharray="4 3"/>
  <text x="520" y="330" fill="rgba(255,255,255,0.4)" font-family="monospace" font-size="10" font-weight="700" text-anchor="middle">SORT RIGHT</text>

  <!-- Falling items -->
  <!-- Blue Sphere (Moving down conveyor) -->
  <circle cx="320" cy="145" r="20" fill="url(#blueSphere)"/>
  <circle cx="314" cy="139" r="4" fill="rgba(255,255,255,0.2)"/>

  <!-- Red Sphere (In scan zone) -->
  <circle cx="320" cy="242" r="20" fill="url(#redSphere)"/>
  <circle cx="314" cy="236" r="4" fill="rgba(255,255,255,0.2)"/>

  <!-- Left/Right indicator arrows -->
  <path d="M 230 250 L 190 250 M 210 240 L 190 250 L 210 260" stroke="#ef5365" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <path d="M 410 250 L 450 250 M 430 240 L 450 250 L 430 260" stroke="#3c82f6" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

</svg>
